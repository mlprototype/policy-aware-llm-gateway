spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: jdbc:postgresql://localhost:5433/gateway
    username: gateway
    password: gateway_local
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  paths-to-match: /v1/**

logging:
  level:
    io.github.mlprototype.gateway: DEBUG
